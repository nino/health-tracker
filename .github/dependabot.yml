# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # The root package.json only forwards scripts into app/ — the real manifest
  # and lockfile (bun.lock) live there.
  - package-ecosystem: "bun"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      js-dependencies:
        patterns:
          - "*"

  # Keep the actions in .github/workflows from going stale.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
